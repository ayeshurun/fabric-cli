# Pre-commit hooks for the Microsoft Fabric CLI.
#
# These catch formatting drift locally, before it reaches CI. Install once with:
#
#     pip install pre-commit
#     pre-commit install
#
# Both hooks read their configuration from [tool.black] / [tool.isort] in
# pyproject.toml, so there is a single source of truth. The `rev` pins below MUST
# stay in sync with the pins in tox.toml ([env.lint] / [env.format]) and
# requirements-dev.txt -- if they diverge, pre-commit and CI will disagree about
# what "formatted" means.
#
# Revisions are full commit SHAs rather than tags: a tag can be repointed by the
# hook repository's maintainer, so a tag is not a reproducible pin and a SHA is.
# This matches the convention upstream microsoft/fabric-cli adopted for its
# GitHub Actions in #271.
#
# The `# frozen:` comments are pre-commit's own convention and are preserved by
# `pre-commit autoupdate --freeze`, which is how these should be bumped. Keep
# them: scripts/check_formatter_pins.py reads the version from that annotation to
# compare it against tox.toml and requirements-dev.txt, and fails if it is absent.
---
repos:
  - repo: https://github.com/PyCQA/isort
    rev: a333737ed43df02b18e6c95477ea1b285b3de15a # frozen: 8.0.1
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 87928e6d6761a4a6d22250e1fee5601b3998086e # frozen: 26.5.1
    hooks:
      - id: black

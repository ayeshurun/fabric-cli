[project]
name = "ms-fabric-cli"
authors = [{ name = "Microsoft Corporation" }]
description = "Command-line tool for Microsoft Fabric"
readme = "README.md"
dynamic = ["version"]
license = "MIT"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
]
dependencies = [
    "msal[broker]>=1.34,<2 ; platform_system != 'Linux'",
    "msal>=1.34,<2",
    "msal_extensions",
    "azure-core>=1.29.0",
    "questionary",
    "prompt_toolkit>=3.0.41",
    "cachetools>=5.5.0",
    "jmespath",
    "pyyaml==6.0.2",
    "argcomplete>=3.6.2",
    "psutil==7.0.0",
    "requests",
    "cryptography",
    "fabric-cicd>=1.2.0",
]

[project.scripts]
fab = "fabric_cli.main:main"

[project.urls]
Repository = "https://github.com/microsoft/fabric-cli.git"

[build-system]
requires = ["setuptools>=65.5.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages.find.where = ["src"]
dynamic.version = { attr = "fabric_cli.__init__.__version__" }
package-data = { "fabric_cli.core.fab_config" = [
    "command_support.yaml",
], "fabric_cli.commands.fs" = [
    "payloads/*",
], "fabric_cli.commands.find" = [
    "type_supported.yaml",
] }

# Formatting configuration.
#
# This block MUST live in pyproject.toml: Black only auto-discovers configuration
# from pyproject.toml, so a [tool.black] table placed anywhere else (e.g. tox.toml)
# is silently ignored.
[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
# No `exclude` is set on purpose. Black's built-in DEFAULT_EXCLUDES already cover
# .git/.tox/.venv/_build/build/dist and friends, and setting `exclude` would
# *replace* those defaults rather than extend them. (__pycache__ is not in
# DEFAULT_EXCLUDES; it is skipped because black honours .gitignore during
# directory traversal.)
#
# `force-exclude` rather than `extend-exclude` is required here. `extend-exclude`
# only applies while walking directories, so it is ignored when a path is passed
# explicitly -- which is exactly how pre-commit invokes black. `force-exclude`
# applies in both cases, keeping `tox -e lint` and pre-commit in agreement.
#
# sample_code/ holds fixtures whose *bytes* are uploaded by tests and recorded
# into VCR cassettes (see tests/test_commands/recordings/.../test_run_spark_job.yaml).
# Reformatting them would change the recorded request bodies.
force-exclude = '''
/tests/test_commands/data/sample_code/
'''

# Import sorting configuration.
#
# `known_first_party` and `src_paths` are pinned explicitly so isort produces
# identical output whether or not fabric_cli is installed in the environment
# running it (tox uses skip_install, pre-commit runs in an isolated venv).
# Without them, `fabric_cli` can be misclassified as third-party.
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
lines_between_types = 0
remove_redundant_aliases = true
known_first_party = ["fabric_cli"]
src_paths = ["src", "tests"]
# Mirrors black's force-exclude above: VCR-recorded payload fixtures must keep
# their exact bytes.
#
# Skip globs are only honoured for *explicitly passed* files when isort runs with
# `--filter-files`; without it, `isort tests/.../sample_code/x.py` rewrites the
# file regardless of this setting. pre-commit's official isort hook injects
# `--filter-files` automatically, and tox.toml passes it explicitly in both the
# `lint` and `format` environments.
#
# `skip_gitignore` keeps isort's directory walk in agreement with black's, which
# honours .gitignore natively. Without it, untracked artefacts (the test suite
# writes generated .py files into tests/test_commands/data/) fail `isort --check-only .`
# while `black --check .` passes -- a confusing, spurious lint failure.
extend_skip_glob = ["tests/test_commands/data/sample_code/*"]
skip_gitignore = true

[tool.mypy]

# Module-specific overrides
[[tool.mypy.overrides]]
module = "pytest.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msal.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msal_extensions"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fabric_cli.utils.fab_mem_store"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyspark.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
# Uncomment to enable live recording mode
# addopts = ["--record"]
markers = [
    "token_claims(arg): override the 'upn' or 'ctid' claim returned by get_token_claims",
]

[project]
name = "ms-fabric-cli"
authors = [{ name = "Microsoft Corporation" }]
description = "Command-line tool for Microsoft Fabric"
readme = "README.md"
dynamic = ["version"]
license = "MIT"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
]
dependencies = [
    "msal[broker]>=1.34,<2 ; platform_system != 'Linux'",
    "msal>=1.34,<2",
    "msal_extensions",
    "azure-core>=1.29.0",
    "questionary",
    "prompt_toolkit>=3.0.41",
    "cachetools>=5.5.0",
    "jmespath",
    "pyyaml==6.0.2",
    "argcomplete>=3.6.2",
    "psutil==7.0.0",
    "requests",
    "cryptography",
    "fabric-cicd>=1.2.0",
]

[project.scripts]
fab = "fabric_cli.main:main"

[project.urls]
Repository = "https://github.com/microsoft/fabric-cli.git"

[build-system]
requires = ["setuptools>=65.5.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages.find.where = ["src"]
dynamic.version = { attr = "fabric_cli.__init__.__version__" }
package-data = { "fabric_cli.core.fab_config" = [
    "command_support.yaml",
], "fabric_cli.commands.fs" = [
    "payloads/*",
], "fabric_cli.commands.find" = [
    "type_supported.yaml",
] }

# Formatting configuration.
#
# This block MUST live in pyproject.toml: Black only auto-discovers configuration
# from pyproject.toml, so a [tool.black] table placed anywhere else (e.g. tox.toml)
# is silently ignored.
[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
# No `exclude` is set on purpose. Black's built-in excludes already cover
# .git/.tox/.venv/_build/build/dist/__pycache__ and friends, and setting `exclude`
# would *replace* those defaults rather than extend them. Use `extend-exclude` if a
# project-specific directory ever needs skipping.

# Import sorting configuration.
#
# `known_first_party` and `src_paths` are pinned explicitly so isort produces
# identical output whether or not fabric_cli is installed in the environment
# running it (tox uses skip_install, pre-commit runs in an isolated venv).
# Without them, `fabric_cli` can be misclassified as third-party.
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
lines_between_types = 0
remove_redundant_aliases = true
known_first_party = ["fabric_cli"]
src_paths = ["src", "tests"]

[tool.mypy]

# Module-specific overrides
[[tool.mypy.overrides]]
module = "pytest.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msal.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msal_extensions"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fabric_cli.utils.fab_mem_store"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyspark.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
# Uncomment to enable live recording mode
# addopts = ["--record"]
markers = [
    "token_claims(arg): override the 'upn' or 'ctid' claim returned by get_token_claims",
]

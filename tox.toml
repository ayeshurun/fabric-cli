requires = ["tox>=4"]
env_list = ["lint", "type", "py310", "py311", "py312", "py313"]

# Base testing environment
[env_run_base]
description = "run unit tests"
deps = [
    "pytest>=8",
    "pytest-sugar",
    "pytest-cov",
    "vcrpy"
]
commands = [
    [
        "pytest",
        { replace = "posargs", default = [
            "--cov",
            "--cov-report=html",
            "--cov-report=xml",
            "--cov-append",
            "tests/test_core",
            "tests/test_utils",
            "tests/test_parsers",
        ], extend = true },
    ],
    [
        "pytest",
        { replace = "posargs", default = [
            "--cov",
            "--cov-report=html",
            "--cov-report=xml",
            "--cov-append",
            "tests/test_commands",
        ], extend = true },
    ],
]

# Linting Environment
#
# Read-only. This env MUST NOT mutate files: `black .` (mutating mode) exits 0
# even when it reformats, which makes the CI job unconditionally green and lets
# formatting drift accumulate silently. `--check` is what actually fails the build.
# Versions are pinned because Black's stable style changes between releases; an
# unpinned formatter means two contributors on different versions reformat each
# other's code forever. Keep these pins in sync with requirements-dev.txt;
# scripts/check_formatter_pins.py fails CI if they drift apart.
#
# `--filter-files` is required for isort to honour the skip globs in
# pyproject.toml when a path is passed explicitly (e.g. `tox -e lint -- some/file.py`).
# Without it those globs only apply while walking directories, and the excluded
# VCR fixtures under tests/test_commands/data/sample_code/ would be reported --
# and, in the `format` env below, actually rewritten.
[env.lint]
description = "Check formatting and import order (read-only, fails on drift)"
skip_install = true
deps = ["black==26.5.1", "isort==8.0.1"]
commands = [
    [
        "isort",
        "--filter-files",
        "--check-only",
        "--diff",
        { replace = "posargs", default = [
            ".",
        ], extend = true },
    ],
    [
        "black",
        "--check",
        "--diff",
        { replace = "posargs", default = [
            ".",
        ], extend = true },
    ],
]

# Formatting Environment
#
# The mutating counterpart to `lint`, for local use: `tox -e format`.
# Deliberately excluded from env_list so it never runs as part of the default
# `tox` invocation or in CI.
[env.format]
description = "Apply formatting and import sorting in place"
skip_install = true
deps = ["black==26.5.1", "isort==8.0.1"]
commands = [
    [
        "isort",
        "--filter-files",
        { replace = "posargs", default = [
            ".",
        ], extend = true },
    ],
    [
        "black",
        { replace = "posargs", default = [
            ".",
        ], extend = true },
    ],
]

# Type Checking Environment
[env.type]
description = "Run type checks"
deps = [
    "mypy",
    "types-PyYAML",
    "types-jmespath",
    "types-requests",
    "types-cachetools",
    "types-psutil",
    "pytest-mypy-plugins",
    "vcrpy",
]
commands = [
    [
        "mypy",
        { replace = "posargs", default = [
            "src",
            "tests",
        ], extend = true },
    ],
]

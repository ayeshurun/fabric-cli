name: fab:build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'tox.toml'
      # MANIFEST.in decides what the build-dist job ships in the sdist, so a
      # change to it alone still needs the build to run.
      - 'MANIFEST.in'
      - 'requirements*.txt'
      - '.github/workflows/fab-build.yml'
      # Every tracked Python file is linted, wherever it lives, so match on the
      # extension instead of enumerating directories -- .ai-assets/ and scripts/
      # each had to be added retroactively after being missed. .ai-assets/ stays
      # listed explicitly because glob implementations vary on whether a leading
      # dot is matched by a wildcard.
      - '**/*.py'
      - '*.py'
      - '**/*.pyi'
      - '.ai-assets/**'
      - '.pre-commit-config.yaml'
      # .gitignore is formatting-relevant: black honours it while walking
      # directories, so a .gitignore-only change can silently add or remove
      # files from the set that `tox -e lint` checks.
      - '.gitignore'
      # Config files that can redefine linting without touching the ones above.
      # isort searches ('.isort.cfg', 'pyproject.toml', 'setup.cfg', 'tox.ini',
      # '.editorconfig') and stops at the first hit, so adding a root .isort.cfg
      # silently overrides pyproject.toml. tox likewise accepts tox.ini/setup.cfg
      # alongside tox.toml.
      - '.isort.cfg'
      - 'setup.cfg'
      - 'tox.ini'
      - '.editorconfig'
      # scripts/ holds the formatter-pin consistency check the lint job runs, as
      # well as any non-.py helper it may grow.
      - 'scripts/**'

permissions:
    contents: read

jobs:
  # Linting Job
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      # Actions touched by this job are pinned to the same full-length SHAs that
      # upstream microsoft/fabric-cli adopted in #271. A tag can be repointed by
      # its maintainer; a SHA cannot. The other jobs in this file still use tags
      # because this branch predates that upstream change and does not touch them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Must be >= the highest target-version in [tool.black]. Black verifies
          # its output by re-parsing the AST, and that check is skipped with a
          # warning when the running interpreter is older than the target (a 3.12
          # interpreter cannot parse code formatted for py313).
          python-version: "3.13"

      - name: Install Tox
        run: |
          python -m pip install --upgrade pip
          # pyyaml is listed explicitly because the pin check imports it directly;
          # it currently arrives as a pre-commit dependency, which is not a
          # guarantee. tomllib is in the stdlib on the 3.13 used here.
          pip install tox pre-commit pyyaml

      - name: Cache Tox environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tox
          key: ${{ runner.os }}-tox-lint-${{ hashFiles('**/tox.toml') }}
          restore-keys: |
            ${{ runner.os }}-tox-lint-

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run Linting
        run: tox -e lint

      # The black/isort versions are declared in tox.toml, requirements-dev.txt
      # and .pre-commit-config.yaml. The two runs either side of this step only
      # catch drift once the versions actually format this codebase differently,
      # which can lag a release by months, so compare the declared pins directly.
      - name: Verify formatter pins agree across tox, requirements-dev and pre-commit
        run: python scripts/check_formatter_pins.py

      # `tox -e lint` and pre-commit resolve their file lists differently: black
      # honours .gitignore while walking directories, whereas pre-commit passes
      # tracked filenames explicitly. A file that is tracked but gitignored is
      # therefore invisible to one and checked by the other. Running both here
      # means any such divergence fails CI instead of silently letting
      # unformatted code through -- and it validates .pre-commit-config.yaml,
      # which nothing else in CI exercises.
      #
      # On a cache miss this clones the hook repositories from github.com, so it
      # is bounded to keep a network stall from occupying a runner for six hours.
      - name: Verify pre-commit hooks agree with tox
        timeout-minutes: 10
        run: pre-commit run --all-files --show-diff-on-failure


  # Type Checking Job
  type-check:
    name: Type Check Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"  # Use any stable Python version for type checking

      - name: Install Tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Cache Tox environments
        uses: actions/cache@v3
        with:
          path: .tox
          key: ${{ runner.os }}-tox-type-${{ hashFiles('**/tox.toml') }}
          restore-keys: |
            ${{ runner.os }}-tox-type-

      - name: Run Type Checks
        run: tox -e type
  
  # Testing Jobs with Matrix Strategy
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            tox-env: "py310"
          - python-version: "3.11"
            tox-env: "py311"
          - python-version: "3.12"
            tox-env: "py312"
          - python-version: "3.13"
            tox-env: "py313"
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Cache Tox environments
        uses: actions/cache@v3
        with:
          path: .tox
          key: ${{ runner.os }}-tox-${{ matrix.tox-env }}-${{ hashFiles('**/tox.toml') }}
          restore-keys: |
            ${{ runner.os }}-tox-${{ matrix.tox-env }}-
            ${{ runner.os }}-tox-

      - name: Run Tests
        run: tox -e ${{ matrix.tox-env }}

      # Upload the coverage report as an artifact
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report-${{ matrix.python-version }}
          path: coverage_html
        
  # Build Job
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs:
      - test  # Ensure all test jobs complete successfully
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

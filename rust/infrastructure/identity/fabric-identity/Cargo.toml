[package]
name = "fabric-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Explicit identity composition boundary for the Fabric Rust CLI"

[package.metadata.fabric]
layer = "identity"

[features]
default = []
windows-broker = ["dep:fabric-identity-windows", "dep:azure_core", "dep:async-trait", "dep:tokio"]
headless = ["dep:azure_identity", "dep:azure_core", "dep:async-trait", "dep:tokio", "dep:serde_json", "dep:thiserror", "dep:rustix"]
certificate-store-windows = ["headless", "dep:fabric-identity-windows", "fabric-identity-windows/certificate-store"]

[dependencies]
fabric-core.workspace = true
azure_identity = { workspace = true, optional = true }
azure_core = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
fabric-identity-windows = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
